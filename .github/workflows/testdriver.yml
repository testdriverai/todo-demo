name: TestDriver.ai Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required to mint the OIDC token for auth
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Authenticate to TestDriver via GitHub OIDC (no stored secret needed once the
    # TestDriver GitHub App is authorized for your org). Falls back to a TD_API_KEY
    # secret if you set one. Exports TD_API_KEY for the test step below.
    - name: Authenticate to TestDriver
      uses: testdriverai/action@stable
      with:
        api-key: ${{ secrets.TD_API_KEY }}

    - name: Start app
      run: |
        npm start &
        npx --yes wait-on http://localhost:3000

    # The TestDriver sandbox is remote and can't reach the runner's localhost,
    # so expose the app through a tunnel created fresh for this run.
    - name: Expose app via tunnel
      run: |
        curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        chmod +x cloudflared
        ./cloudflared tunnel --url http://localhost:3000 --no-autoupdate > tunnel.log 2>&1 &
        for i in $(seq 1 30); do
          url=$(grep -Eo 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' tunnel.log | head -n1 || true)
          [ -n "$url" ] && break
          sleep 2
        done
        [ -n "$url" ] || { cat tunnel.log; exit 1; }
        echo "TEST_URL=$url" >> "$GITHUB_ENV"

    - name: Run TestDriver.ai tests
      run: npm run test:testdriver

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: test-results/
        retention-days: 30
