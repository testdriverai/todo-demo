<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo Demo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Todos</h1>
        <form id="new-todo-form" class="new-todo">
          <input id="new-todo" type="text" placeholder="What needs doing?" autocomplete="off" aria-label="New todo" />
          <button type="submit">Add</button>
        </form>
      </header>

      <nav class="filters" aria-label="Filter todos">
        <button type="button" data-filter="all">All</button>
        <button type="button" data-filter="active">Active</button>
        <button type="button" data-filter="completed">Completed</button>
      </nav>

      <ul id="todo-list" class="todo-list"></ul>
      <p id="empty-state" class="empty">Nothing to do. Add your first todo above.</p>

      <footer id="footer" class="app-footer" hidden>
        <span id="items-left">0 items left</span>
        <button id="clear-completed" type="button" hidden>Clear completed</button>
      </footer>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
